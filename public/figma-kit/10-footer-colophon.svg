<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="300" viewBox="0 0 1440 300" fill="none">
  <g id="Footer-Museum-Colophon">
    <rect width="1440" height="300" fill="#06080B"/>
    <line x1="0" y1="1" x2="1440" y2="1" stroke="#C8A45D" stroke-opacity="0.35" stroke-width="1"/>
    <rect x="716" y="-3" width="8" height="8" transform="rotate(45 720 1)" fill="#E6C98A"/>

    <text x="72" y="76" fill="#E6C98A" font-family="Cormorant Garamond, Georgia, serif" font-size="32" font-weight="600" letter-spacing="7">TARGİM</text>
    <text x="76" y="96" fill="#D6CDBB" font-family="Inter, Arial, sans-serif" font-size="9.5" letter-spacing="6">ARCHIVE</text>
    <text x="72" y="136" fill="#A79E8E" font-family="Inter, Arial, sans-serif" font-size="13.5">Çeçen, İnguş ve Kuzey Kafkasya halklarının tarihini,</text>
    <text x="72" y="158" fill="#A79E8E" font-family="Inter, Arial, sans-serif" font-size="13.5">biyografilerini, el yazmalarını ve taş kule mirasını koruyan bağımsız dijital hafıza arşivi.</text>

    <g id="Footer-Col-Kesfet" transform="translate(620, 64)">
      <text x="0" y="0" fill="#C8A45D" font-family="Inter, Arial, sans-serif" font-size="11" letter-spacing="3">KOLEKSİYONLAR</text>
      <text x="0" y="34" fill="#EFE6D5" font-family="Inter, Arial, sans-serif" font-size="13">Kişiler (16 Portre)</text>
      <text x="0" y="60" fill="#EFE6D5" font-family="Inter, Arial, sans-serif" font-size="13">Arşiv Belgeleri</text>
      <text x="0" y="86" fill="#EFE6D5" font-family="Inter, Arial, sans-serif" font-size="13">Zaman Çizelgesi (1700–2000)</text>
      <text x="0" y="112" fill="#EFE6D5" font-family="Inter, Arial, sans-serif" font-size="13">Kafkasya Tarih Atlası</text>
    </g>

    <g id="Footer-Col-Miras" transform="translate(940, 64)">
      <text x="0" y="0" fill="#C8A45D" font-family="Inter, Arial, sans-serif" font-size="11" letter-spacing="3">KÜLTÜR &amp; HAFIZA</text>
      <text x="0" y="34" fill="#EFE6D5" font-family="Inter, Arial, sans-serif" font-size="13">Dijital Sergiler</text>
      <text x="0" y="60" fill="#EFE6D5" font-family="Inter, Arial, sans-serif" font-size="13">Vaynah Kule Mimarisi</text>
      <text x="0" y="86" fill="#EFE6D5" font-family="Inter, Arial, sans-serif" font-size="13">Nohçalla &amp; Ezdel</text>
      <text x="0" y="112" fill="#EFE6D5" font-family="Inter, Arial, sans-serif" font-size="13">Hakkında &amp; Belge Katkısı</text>
    </g>

    <line x1="72" y1="236" x2="1368" y2="236" stroke="#C8A45D" stroke-opacity="0.22" stroke-width="1"/>
    <text x="72" y="268" fill="#8C8374" font-family="Inter, Arial, sans-serif" font-size="12">© Targim Archive · Dijital Tarih ve Kültür Hafızası</text>
    <text x="1368" y="268" text-anchor="end" fill="#C8A45D" font-family="Cormorant Garamond, Georgia, serif" font-size="15" font-style="italic">“Toprak unutmaz, insan bazen unutur.”</text>
  </g>
</svg>