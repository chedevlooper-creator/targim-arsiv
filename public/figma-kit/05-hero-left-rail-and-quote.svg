<svg xmlns="http://www.w3.org/2000/svg" width="680" height="430" viewBox="0 0 680 430" fill="none">
  <g id="Hero-Rail-And-Proverb-Card">
    <rect width="680" height="430" fill="#07090C"/>
    <rect x="12" y="12" width="656" height="406" stroke="#C8A45D" stroke-opacity="0.3" stroke-width="1"/>

    <g id="Hero-Left-Vertical-Rail" transform="translate(24, 16)">
      <line x1="64" y1="24" x2="64" y2="318" stroke="#C8A45D" stroke-opacity="0.45" stroke-width="1"/>
      
      <g id="Rail-Node-01">
        <text x="28" y="60" fill="#C8A45D" font-family="Cormorant Garamond, Georgia, serif" font-size="15">01</text>
        <rect x="60.0" y="52.0" width="8" height="8" transform="rotate(45 64 56)" fill="#E6C98A" stroke="#C8A45D" stroke-width="1.2"/>
        <text x="86" y="60" fill="#F5E4BA" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="500" letter-spacing="2.5">DAĞLAR</text>
      </g>
      <g id="Rail-Node-02">
        <text x="28" y="112" fill="#C8A45D" font-family="Cormorant Garamond, Georgia, serif" font-size="15">02</text>
        <rect x="61.0" y="105.0" width="6" height="6" transform="rotate(45 64 108)" fill="#07090C" stroke="#C8A45D" stroke-width="1.2"/>
        <text x="86" y="112" fill="#B8AE9C" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="500" letter-spacing="2.5">İNSANLAR</text>
      </g>
      <g id="Rail-Node-03">
        <text x="28" y="164" fill="#C8A45D" font-family="Cormorant Garamond, Georgia, serif" font-size="15">03</text>
        <rect x="61.0" y="157.0" width="6" height="6" transform="rotate(45 64 160)" fill="#07090C" stroke="#C8A45D" stroke-width="1.2"/>
        <text x="86" y="164" fill="#B8AE9C" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="500" letter-spacing="2.5">MÜCADELE</text>
      </g>
      <g id="Rail-Node-04">
        <text x="28" y="216" fill="#C8A45D" font-family="Cormorant Garamond, Georgia, serif" font-size="15">04</text>
        <rect x="61.0" y="209.0" width="6" height="6" transform="rotate(45 64 212)" fill="#07090C" stroke="#C8A45D" stroke-width="1.2"/>
        <text x="86" y="216" fill="#B8AE9C" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="500" letter-spacing="2.5">YERLEŞİMLER</text>
      </g>
      <g id="Rail-Node-05">
        <text x="28" y="268" fill="#C8A45D" font-family="Cormorant Garamond, Georgia, serif" font-size="15">05</text>
        <rect x="61.0" y="261.0" width="6" height="6" transform="rotate(45 64 264)" fill="#07090C" stroke="#C8A45D" stroke-width="1.2"/>
        <text x="86" y="268" fill="#B8AE9C" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="500" letter-spacing="2.5">BELGELER</text>
      </g>
      <g id="Watch-Trailer-Trigger" transform="translate(36, 318)">
        <circle cx="28" cy="28" r="26" fill="#0A0D12" stroke="#C8A45D" stroke-opacity="0.85" stroke-width="1.2"/>
        <circle cx="28" cy="28" r="21" stroke="#C8A45D" stroke-opacity="0.35" stroke-width="0.9"/>
        <polygon points="25,20 37,28 25,36" fill="#F5E4BA"/>
        <text x="68" y="24" fill="#EFE6D5" font-family="Inter, Arial, sans-serif" font-size="11.5" font-weight="500">Tanıtım</text>
        <text x="68" y="40" fill="#EFE6D5" font-family="Inter, Arial, sans-serif" font-size="11.5" font-weight="500">Filmi İzle →</text>
      </g>
    </g>

    <g id="Hero-Proverb-Card" transform="translate(332, 126)">
      <rect width="296" height="156" fill="#0B0E13" fill-opacity="0.86" stroke="#C8A45D" stroke-opacity="0.42" stroke-width="1"/>
      <rect x="5" y="5" width="286" height="146" stroke="#C8A45D" stroke-opacity="0.16" stroke-width="1"/>
      <text x="24" y="48" fill="#C8A45D" font-family="Cormorant Garamond, Georgia, serif" font-size="42">“</text>
      <text x="28" y="80" fill="#EFE6D5" font-family="Cormorant Garamond, Georgia, serif" font-size="22" font-style="italic">Toprak unutmaz,</text>
      <text x="28" y="108" fill="#EFE6D5" font-family="Cormorant Garamond, Georgia, serif" font-size="22" font-style="italic">insan bazen unutur.</text>
      <line x1="28" y1="132" x2="254" y2="132" stroke="#C8A45D" stroke-opacity="0.4" stroke-width="1"/>
      <rect x="261" y="128.5" width="7" height="7" transform="rotate(45 264.5 132)" fill="#E6C98A"/>
    </g>
  </g>
